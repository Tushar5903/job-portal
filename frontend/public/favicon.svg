  <!-- Search circle -->
  <circle cx="24" cy="34" r="8" fill="none" stroke="#ffffff" stroke-width="4"/>
  <line x1="30" y1="40" x2="36" y2="46" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Small accent -->
